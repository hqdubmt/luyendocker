services:
  node_docker_dev:
    container_name: node_docker_dev
    restart: always

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env  

    ports:
      - "${port}:3000"

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    networks:
      - node-docker_dev

networks:
  node-docker_dev:
    driver: bridge
